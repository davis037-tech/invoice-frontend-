<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
  .stat-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:20px; }
  .stat-box { border:1px solid var(--paper-line); border-radius:6px; padding:14px; }
  .stat-box .num { font-family:'Source Serif 4', serif; font-size:26px; font-weight:700; }
  .stat-box .label { font-size:12px; color:#8a8378; text-transform:uppercase; letter-spacing:.04em; }
  .tenant-row { border:1px solid var(--paper-line); border-radius:6px; padding:14px; margin-bottom:12px; }
  .tenant-row select, .tenant-row input[type=number] { width:auto; display:inline-block; }
  .quota-bar { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin-top:6px; }
  .quota-bar-fill { height:100%; background:var(--stamp-red, #a33); }
  .login-chart { display:flex; align-items:flex-end; gap:8px; height:80px; margin-bottom:6px; }
  .login-chart .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .login-chart .bar { width:100%; background:var(--stamp-red, #a33); border-radius:3px 3px 0 0; min-height:2px; }
  .login-chart .bar-label { font-size:10px; color:#8a8378; margin-top:4px; }
  .login-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--paper-line); font-size:13px; }
  .login-row:last-child { border-bottom:none; }
</style>
</head>
<body>
  <div class="shell">
    <div class="topbar" id="topbar"></div>

    <div class="list-head">
      <h1 style="font-size:22px;">Admin</h1>
    </div>

    <div id="error-box"></div>
    <div id="stats" class="stat-grid"></div>

    <div class="list-head" style="margin-top:8px;">
      <h3 style="margin:0;">Your bank details</h3>
    </div>
    <div class="card" id="platform-settings-card" style="margin-bottom:24px;">
      <p class="muted">Loading…</p>
    </div>

    <div class="list-head" style="margin-top:8px;">
      <h3 style="margin:0;">Upgrade requests</h3>
    </div>
    <div id="upgrade-requests-list" style="margin-bottom:24px;">
      <p class="muted">Loading…</p>
    </div>

    <div class="list-head" style="margin-top:8px;">
      <h3 style="margin:0;">Default weekly limits per plan</h3>
    </div>
    <div class="card" id="plan-limits-card" style="margin-bottom:24px;">
      <p class="muted">Loading…</p>
    </div>

    <div class="list-head" style="margin-top:8px;">
      <h3 style="margin:0;">Default weekly PDF downloads per plan</h3>
    </div>
    <div class="card" id="pdf-plan-limits-card" style="margin-bottom:24px;">
      <p class="muted">Loading…</p>
    </div>

    <div class="list-head" style="margin-top:8px;">
      <h3 style="margin:0;">Login activity</h3>
    </div>
    <div class="card" id="login-daily-card" style="margin-bottom:12px;">
      <p class="muted">Loading…</p>
    </div>
    <div style="margin-bottom:12px; display:flex; gap:8px;">
      <button class="btn btn-ghost" data-login-range="today">Today</button>
      <button class="btn btn-ghost" data-login-range="week">This week</button>
    </div>
    <div class="card" id="login-list-card" style="margin-bottom:24px;">
      <p class="muted">Loading…</p>
    </div>

    <div class="list-head" style="margin-top:8px;">
      <h3 style="margin:0;">Accounts</h3>
    </div>
    <div id="tenants-list"><p class="muted">Loading…</p></div>
  </div>

<script src="api.js"></script>
<script src="nav.js"></script>
<script>
Auth.requireLogin();
renderTopbar("admin");

const errorBox = document.getElementById("error-box");
const statsEl = document.getElementById("stats");
const listEl = document.getElementById("tenants-list");
let PLAN_OPTIONS = ["FREE", "PRO", "TEAM"];

async function loadStats() {
  try {
    const { data } = await apiFetch("/admin/stats");
    statsEl.innerHTML = `
      <div class="stat-box"><div class="num">${data.total_tenants}</div><div class="label">Users / accounts</div></div>
      <div class="stat-box"><div class="num">${data.signups_this_week}</div><div class="label">Signups this week</div></div>
      <div class="stat-box"><div class="num">${data.invoices_this_week}</div><div class="label">Invoices this week</div></div>
      <div class="stat-box"><div class="num">${data.total_invoices}</div><div class="label">Invoices all-time</div></div>
    `;
  } catch (err) {
    showError(errorBox, err.message);
  }
}

async function loadTenants() {
  try {
    const res = await apiFetch("/admin/tenants");
    PLAN_OPTIONS = res.meta.plans;
    render(res.data);
  } catch (err) {
    showError(errorBox, err.message);
  }
}

function render(tenants) {
  if (!tenants.length) {
    listEl.innerHTML = `<p class="muted">No accounts yet.</p>`;
    return;
  }

  listEl.innerHTML = tenants.map(t => {
    const pct = t.weekly_limit > 0 ? Math.min(100, Math.round((t.weekly_used / t.weekly_limit) * 100)) : 0;
    return `
    <div class="tenant-row" data-id="${t.id}">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
        <div>
          <div class="primary">${escapeHtml(t.name)}</div>
          <div class="secondary">${escapeHtml(t.owner_email || "—")} · joined ${formatDate(t.created_at)}</div>
        </div>
        <div style="text-align:right; font-size:13px;">
          <div>${t.weekly_used} / ${t.weekly_limit} invoices this week</div>
          <div>${t.pdf_weekly_used} / ${t.pdf_weekly_limit} PDFs this week</div>
          <div class="muted" style="font-size:12px;">${t.total_invoices} total</div>
        </div>
      </div>
      <div class="quota-bar"><div class="quota-bar-fill" style="width:${pct}%;"></div></div>

      <div style="display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap;">
        <label class="muted" style="font-size:12px;">Plan
          <select data-plan>
            ${PLAN_OPTIONS.map(p => `<option value="${p}" ${p === t.plan ? "selected" : ""}>${p}</option>`).join("")}
          </select>
        </label>
        <label class="muted" style="font-size:12px;">Override invoice limit
          <input type="number" min="0" data-override placeholder="none" value="${t.invoice_limit_override ?? ""}" style="width:80px;" />
        </label>
        <label class="muted" style="font-size:12px;">Override PDF limit
          <input type="number" min="0" data-pdf-override placeholder="none" value="${t.pdf_limit_override ?? ""}" style="width:80px;" />
        </label>
        <button class="btn btn-ghost" data-save>Save</button>
        <span class="muted save-status" style="font-size:12px;"></span>
      </div>
    </div>
  `;
  }).join("");

  listEl.querySelectorAll(".tenant-row").forEach(row => {
    const id = row.dataset.id;
    row.querySelector("[data-save]").addEventListener("click", () => saveTenant(id, row));
  });
}

async function saveTenant(id, row) {
  const plan = row.querySelector("[data-plan]").value;
  const overrideRaw = row.querySelector("[data-override]").value.trim();
  const override = overrideRaw === "" ? null : parseInt(overrideRaw, 10);
  const pdfOverrideRaw = row.querySelector("[data-pdf-override]").value.trim();
  const pdfOverride = pdfOverrideRaw === "" ? null : parseInt(pdfOverrideRaw, 10);
  const statusEl = row.querySelector(".save-status");
  const btn = row.querySelector("[data-save]");

  btn.disabled = true;
  statusEl.textContent = "Saving…";
  try {
    await apiFetch(`/admin/tenants/${id}`, {
      method: "PUT",
      body: { plan, invoice_limit_override: override, pdf_limit_override: pdfOverride },
    });
    statusEl.textContent = "Saved";
    setTimeout(() => { statusEl.textContent = ""; }, 1500);
  } catch (err) {
    statusEl.textContent = "";
    showError(errorBox, err.message);
  } finally {
    btn.disabled = false;
  }
}

async function loadPlanLimits() {
  try {
    const { data } = await apiFetch("/admin/plan-limits");
    const card = document.getElementById("plan-limits-card");
    card.innerHTML = `
      <p class="muted" style="margin-top:0;">Applies to every account on that plan, unless a specific account has an override set below.</p>
      <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end;">
        ${Object.entries(data).map(([plan, limit]) => `
          <label style="font-size:12px; color:#8a8378;">
            ${plan}
            <input type="number" min="0" data-plan-limit="${plan}" value="${limit}" style="width:90px; display:block; margin-top:4px;" />
          </label>
        `).join("")}
        <button class="btn btn-ghost" id="save-plan-limits-btn">Save defaults</button>
        <span class="muted" id="plan-limits-status" style="font-size:12px;"></span>
      </div>
    `;
    document.getElementById("save-plan-limits-btn").addEventListener("click", savePlanLimits);
  } catch (err) {
    showError(errorBox, err.message);
  }
}

async function savePlanLimits() {
  const inputs = document.querySelectorAll("[data-plan-limit]");
  const payload = {};
  inputs.forEach(input => { payload[input.dataset.planLimit] = parseInt(input.value, 10) || 0; });
  const statusEl = document.getElementById("plan-limits-status");
  const btn = document.getElementById("save-plan-limits-btn");

  btn.disabled = true;
  statusEl.textContent = "Saving…";
  try {
    await apiFetch("/admin/plan-limits", { method: "PUT", body: payload });
    statusEl.textContent = "Saved";
    setTimeout(() => { statusEl.textContent = ""; }, 1500);
    loadTenants(); // refresh so tenant rows reflect the new defaults
  } catch (err) {
    statusEl.textContent = "";
    showError(errorBox, err.message);
  } finally {
    btn.disabled = false;
  }
}

async function loadPdfPlanLimits() {
  try {
    const { data } = await apiFetch("/admin/pdf-plan-limits");
    const card = document.getElementById("pdf-plan-limits-card");
    card.innerHTML = `
      <p class="muted" style="margin-top:0;">Applies to every account on that plan, unless a specific account has an override set below.</p>
      <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end;">
        ${Object.entries(data).map(([plan, limit]) => `
          <label style="font-size:12px; color:#8a8378;">
            ${plan}
            <input type="number" min="0" data-pdf-plan-limit="${plan}" value="${limit}" style="width:90px; display:block; margin-top:4px;" />
          </label>
        `).join("")}
        <button class="btn btn-ghost" id="save-pdf-plan-limits-btn">Save defaults</button>
        <span class="muted" id="pdf-plan-limits-status" style="font-size:12px;"></span>
      </div>
    `;
    document.getElementById("save-pdf-plan-limits-btn").addEventListener("click", savePdfPlanLimits);
  } catch (err) {
    showError(errorBox, err.message);
  }
}

async function savePdfPlanLimits() {
  const inputs = document.querySelectorAll("[data-pdf-plan-limit]");
  const payload = {};
  inputs.forEach(input => { payload[input.dataset.pdfPlanLimit] = parseInt(input.value, 10) || 0; });
  const statusEl = document.getElementById("pdf-plan-limits-status");
  const btn = document.getElementById("save-pdf-plan-limits-btn");

  btn.disabled = true;
  statusEl.textContent = "Saving…";
  try {
    await apiFetch("/admin/pdf-plan-limits", { method: "PUT", body: payload });
    statusEl.textContent = "Saved";
    setTimeout(() => { statusEl.textContent = ""; }, 1500);
    loadTenants();
  } catch (err) {
    statusEl.textContent = "";
    showError(errorBox, err.message);
  } finally {
    btn.disabled = false;
  }
}

let loginActivityData = null;
let currentLoginRange = "week";

async function loadLoginActivity() {
  try {
    const { data } = await apiFetch("/admin/login-activity");
    loginActivityData = data;
    renderLoginChart(data);
    renderLoginList();
  } catch (err) {
    showError(errorBox, err.message);
  }
}

function renderLoginChart(data) {
  const card = document.getElementById("login-daily-card");
  const maxCount = Math.max(1, ...data.daily.map(d => d.count));
  card.innerHTML = `
    <p class="muted" style="margin-top:0;">${data.unique_today} unique user${data.unique_today === 1 ? "" : "s"} logged in today · ${data.unique_this_week} this week</p>
    <div class="login-chart">
      ${data.daily.map(d => `
        <div class="bar-col">
          <div class="bar" style="height:${(d.count / maxCount) * 100}%;" title="${d.count} logins, ${d.unique_users} unique"></div>
          <div class="bar-label">${d.date.slice(5)}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderLoginList() {
  if (!loginActivityData) return;
  const card = document.getElementById("login-list-card");
  const now = new Date();
  const todayKey = now.toISOString().slice(0, 10);

  const filtered = currentLoginRange === "today"
    ? loginActivityData.recent.filter(e => e.created_at.slice(0, 10) === todayKey)
    : loginActivityData.recent;

  if (!filtered.length) {
    card.innerHTML = `<p class="muted">No logins ${currentLoginRange === "today" ? "yet today" : "this week"}.</p>`;
    return;
  }

  card.innerHTML = filtered.map(e => `
    <div class="login-row">
      <span>${escapeHtml(e.email)}${e.tenant_name ? ` <span class="muted">· ${escapeHtml(e.tenant_name)}</span>` : ""}</span>
      <span class="muted">${new Date(e.created_at).toLocaleString()}</span>
    </div>
  `).join("");
}

document.querySelectorAll("[data-login-range]").forEach(btn => {
  btn.addEventListener("click", () => {
    currentLoginRange = btn.dataset.loginRange;
    document.querySelectorAll("[data-login-range]").forEach(b => b.style.borderColor = "");
    btn.style.borderColor = "var(--ink)";
    renderLoginList();
  });
});

async function loadPlatformSettings() {
  try {
    const { data } = await apiFetch("/admin/platform-settings");
    const card = document.getElementById("platform-settings-card");
    card.innerHTML = `
      <p class="muted" style="margin-top:0;">Shown to tenants who request an upgrade — this is where they send payment.</p>
      <div class="field-row">
        <div class="field">
          <label>Bank name</label>
          <input type="text" id="pf-bank-name" value="${data.bank_name || ""}" />
        </div>
        <div class="field">
          <label>Account name</label>
          <input type="text" id="pf-account-name" value="${data.account_name || ""}" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Account number</label>
          <input type="text" id="pf-account-number" value="${data.account_number || ""}" />
        </div>
        <div class="field">
          <label>Routing/IBAN <span class="muted">(optional)</span></label>
          <input type="text" id="pf-routing" value="${data.routing_number || ""}" />
        </div>
      </div>
      <div class="field">
        <label>SWIFT/BIC <span class="muted">(optional)</span></label>
        <input type="text" id="pf-swift" value="${data.swift_code || ""}" />
      </div>
      <button class="btn btn-ghost" id="save-platform-settings-btn">Save</button>
      <span class="muted" id="platform-settings-status" style="font-size:12px; margin-left:8px;"></span>
    `;
    document.getElementById("save-platform-settings-btn").addEventListener("click", savePlatformSettings);
  } catch (err) {
    showError(errorBox, err.message);
  }
}

async function savePlatformSettings() {
  const statusEl = document.getElementById("platform-settings-status");
  const btn = document.getElementById("save-platform-settings-btn");
  btn.disabled = true;
  statusEl.textContent = "Saving…";
  try {
    await apiFetch("/admin/platform-settings", {
      method: "PUT",
      body: {
        bank_name: document.getElementById("pf-bank-name").value.trim() || null,
        account_name: document.getElementById("pf-account-name").value.trim() || null,
        account_number: document.getElementById("pf-account-number").value.trim() || null,
        routing_number: document.getElementById("pf-routing").value.trim() || null,
        swift_code: document.getElementById("pf-swift").value.trim() || null,
      },
    });
    statusEl.textContent = "Saved";
    setTimeout(() => { statusEl.textContent = ""; }, 1500);
  } catch (err) {
    statusEl.textContent = "";
    showError(errorBox, err.message);
  } finally {
    btn.disabled = false;
  }
}

async function loadUpgradeRequests() {
  try {
    const { data } = await apiFetch("/admin/upgrade-requests?status=PENDING");
    const listEl = document.getElementById("upgrade-requests-list");
    if (!data.length) {
      listEl.innerHTML = `<p class="muted">No pending upgrade requests.</p>`;
      return;
    }
    listEl.innerHTML = data.map(r => `
      <div class="card" style="margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
          <div>
            <div class="primary">${escapeHtml(r.tenant_name)} → ${r.requested_plan}</div>
            <div class="secondary">${escapeHtml(r.owner_email || "")} · currently ${r.current_plan} · requested ${formatDate(r.created_at)}</div>
          </div>
          <div style="display:flex; gap:8px; flex-shrink:0;">
            <button class="btn btn-stamp" data-approve="${r.id}">Approve</button>
            <button class="btn btn-ghost" data-reject="${r.id}">Reject</button>
          </div>
        </div>
        ${r.note ? `<p class="muted" style="white-space:pre-line; margin-top:10px;">${escapeHtml(r.note)}</p>` : ""}
        ${r.image_base64 ? `<img src="${r.image_base64}" style="max-width:200px; border:1px solid var(--paper-line); border-radius:4px; margin-top:8px;" />` : ""}
      </div>
    `).join("");

    listEl.querySelectorAll("[data-approve]").forEach(btn => {
      btn.addEventListener("click", () => reviewUpgradeRequest(btn.dataset.approve, "approve", btn));
    });
    listEl.querySelectorAll("[data-reject]").forEach(btn => {
      btn.addEventListener("click", () => reviewUpgradeRequest(btn.dataset.reject, "reject", btn));
    });
  } catch (err) {
    showError(errorBox, err.message);
  }
}

async function reviewUpgradeRequest(id, action, btn) {
  btn.disabled = true;
  try {
    await apiFetch(`/admin/upgrade-requests/${id}/${action}`, { method: "POST" });
    loadUpgradeRequests();
    loadTenants();
  } catch (err) {
    showError(errorBox, err.message);
    btn.disabled = false;
  }
}

loadStats();
loadPlanLimits();
loadPdfPlanLimits();
loadPlatformSettings();
loadUpgradeRequests();
loadLoginActivity();
loadTenants();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — Set new password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
  .pw-toggle {
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:#8a8378; font-size:12px;
    text-transform:uppercase; letter-spacing:.03em; cursor:pointer; padding:6px 8px;
  }
  .pw-toggle:hover { color:#3a352c; }
</style>
</head>
<body class="no-rule">
  <div class="center-page">
    <div class="auth-card">
      <div style="margin-bottom:28px;">
        <div class="eyebrow">Ledger</div>
        <h1>Set a new password</h1>
        <p class="muted" style="margin-top:4px;">Choose a new password for your account.</p>
      </div>

      <div id="error-box"></div>
      <div id="success-box"></div>

      <form id="reset-form" class="card">
        <div class="field">
          <label for="password">New password</label>
          <div style="position:relative;">
            <input id="password" name="password" type="password" placeholder="At least 8 characters" minlength="8" required style="padding-right:56px;" />
            <button type="button" class="pw-toggle" data-target="password">Show</button>
          </div>
        </div>
        <div class="field">
          <label for="confirm_password">Confirm new password</label>
          <div style="position:relative;">
            <input id="confirm_password" name="confirm_password" type="password" placeholder="Re-enter your password" minlength="8" required style="padding-right:56px;" />
            <button type="button" class="pw-toggle" data-target="confirm_password">Show</button>
          </div>
        </div>
        <button class="btn btn-stamp" type="submit" id="submit-btn" style="width:100%; justify-content:center;">
          Set new password
        </button>
      </form>

      <p class="muted" style="text-align:center; margin-top:20px; font-size:13px;">
        <a class="text-link" href="login.html">← Back to sign in</a>
      </p>
    </div>
  </div>

<script src="api.js"></script>
<script>
document.querySelectorAll(".pw-toggle").forEach(btn => {
  btn.addEventListener("click", () => {
    const input = document.getElementById(btn.dataset.target);
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    btn.textContent = showing ? "Show" : "Hide";
  });
});

const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const form = document.getElementById("reset-form");
const errorBox = document.getElementById("error-box");
const successBox = document.getElementById("success-box");
const submitBtn = document.getElementById("submit-btn");

if (!token) {
  showError(errorBox, "This link is missing a reset token. Request a new one from the sign-in page.");
  form.style.display = "none";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.innerHTML = "";
  successBox.innerHTML = "";

  if (form.password.value !== form.confirm_password.value) {
    showError(errorBox, "Passwords don't match.");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Updating…";

  try {
    const data = await apiFetch("/auth/reset-password", {
      method: "POST",
      body: { token, password: form.password.value },
      skipAuth: true,
    });
    successBox.innerHTML = `<div class="card"><p style="margin:0 0 12px;">${data.message}</p><a class="btn btn-stamp" href="login.html">Go to sign in</a></div>`;
    form.style.display = "none";
  } catch (err) {
    showError(errorBox, err.message);
    submitBtn.disabled = false;
    submitBtn.textContent = "Set new password";
  }
});
</script>
</body>
</html>

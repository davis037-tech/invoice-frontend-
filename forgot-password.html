<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — Reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body class="no-rule">
  <div class="center-page">
    <div class="auth-card">
      <div style="margin-bottom:28px;">
        <div class="eyebrow">Ledger</div>
        <h1>Reset your password</h1>
        <p class="muted" style="margin-top:4px;">Enter your email and we'll send you a link to set a new password.</p>
      </div>

      <div id="error-box"></div>
      <div id="success-box"></div>

      <form id="forgot-form" class="card">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@acme.com" required />
        </div>
        <button class="btn btn-stamp" type="submit" id="submit-btn" style="width:100%; justify-content:center;">
          Send reset link
        </button>
      </form>

      <p class="muted" style="text-align:center; margin-top:20px; font-size:13px;">
        <a class="text-link" href="login.html">← Back to sign in</a>
      </p>
    </div>
  </div>

<script src="api.js"></script>
<script>
const form = document.getElementById("forgot-form");
const errorBox = document.getElementById("error-box");
const successBox = document.getElementById("success-box");
const submitBtn = document.getElementById("submit-btn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.innerHTML = "";
  successBox.innerHTML = "";
  submitBtn.disabled = true;
  submitBtn.textContent = "Sending…";

  try {
    const data = await apiFetch("/auth/forgot-password", {
      method: "POST",
      body: { email: form.email.value.trim() },
      skipAuth: true,
    });
    successBox.innerHTML = `<div class="card"><p style="margin:0;">${data.message}</p></div>`;
    form.style.display = "none";
  } catch (err) {
    showError(errorBox, err.message);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Send reset link";
  }
});
</script>
</body>
</html>
